name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.6
  NODE_VERSION: 24.19.0
  BUILDX_METADATA_PROVENANCE: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  backend:
    name: Go format, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          check-latest: false

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "${unformatted}" || { printf 'Run gofmt on:\n%s\n' "${unformatted}"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build backend
        run: go build -trimpath -o multispeed ./cmd/multispeed

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint, type check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify generated OpenAPI types
        working-directory: .
        shell: bash
        run: |
          npm --prefix web run generate:api-types
          git diff --exit-code -- web/src/lib/openapi
          test -z "$(git status --porcelain --untracked-files=all -- web/src/lib/openapi)"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload Dependabot frontend candidate
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-frontend-dist-${{ github.event.pull_request.number }}
          path: internal/frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Verify committed embedded frontend is current
        working-directory: .
        shell: bash
        run: |
          git diff --exit-code -- internal/frontend/dist
          test -z "$(git status --porcelain --untracked-files=all -- internal/frontend/dist)"

      - name: Reject production source maps
        working-directory: .
        shell: bash
        run: test -z "$(find web/dist internal/frontend/dist -type f -name '*.map' -print -quit)"

      - name: Lint OpenAPI contract
        working-directory: .
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: npx --yes @redocly/cli@2.41.1 lint openapi.yaml --format stylish

      - name: Upload production frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: true

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        env:
          ACCEPT_OOKLA_EULA: "false"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Docker build, scan, SBOM, and smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: multispeed:ci
          build-args: |
            VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate bundled license and corresponding-source artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir legal-artifacts
          container_id="$(docker create multispeed:ci)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/opt/multispeed/release-artifacts/." legal-artifacts/
          docker rm "${container_id}" >/dev/null
          trap - EXIT
          (
            cd legal-artifacts
            sha256sum -c ./*.sha256
          )
          license_archive="legal-artifacts/multispeed-third-party-licenses.tar.gz"
          source_archive="$(find legal-artifacts -maxdepth 1 -type f -name 'librespeed-cli-*-multispeed-corresponding-source.tar.gz' -print -quit)"
          test -n "${source_archive}"
          tar -tzf "${license_archive}" > legal-artifacts/license-contents.txt
          tar -tzf "${source_archive}" > legal-artifacts/source-contents.txt
          grep -Fx 'multispeed/THIRD_PARTY_NOTICES.md' legal-artifacts/license-contents.txt
          grep -Fx 'librespeed-cli/COPYING' legal-artifacts/license-contents.txt
          grep -Fx 'librespeed-cli/COPYING.LESSER' legal-artifacts/license-contents.txt
          grep -E '^multispeed/third-party/npm/vite@[^/]+/' legal-artifacts/license-contents.txt
          grep -E '^multispeed/third-party/npm/tailwindcss@[^/]+/' legal-artifacts/license-contents.txt
          grep -E '^multispeed/third-party/npm/rolldown@[^/]+/THIRD-PARTY-LICENSE$' legal-artifacts/license-contents.txt
          grep -Fx './build-corresponding-source.sh' legal-artifacts/source-contents.txt
          grep -Fx './COPYING' legal-artifacts/source-contents.txt
          grep -Fx './COPYING.LESSER' legal-artifacts/source-contents.txt
          grep -Fx './vendor/modules.txt' legal-artifacts/source-contents.txt
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' multispeed:ci)" = 'MIT AND LGPL-3.0-only AND LGPL-3.0-or-later'

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: multispeed:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: multispeed:ci
          format: spdx-json
          output: multispeed.spdx.json

      - name: Validate frontend components in SPDX SBOM
        shell: bash
        run: bash scripts/validate-spdx-frontend.sh multispeed.spdx.json legal-artifacts/multispeed-third-party-licenses.tar.gz

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multispeed-sbom
          path: multispeed.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload legal artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multispeed-legal-artifacts
          path: legal-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Docker smoke test
        env:
          MULTISPEED_SMOKE_PORT: "18787"
        run: bash scripts/docker-smoke.sh multispeed:ci
